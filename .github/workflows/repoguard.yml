name: RepoGuard — pre-agent repository scan

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      semantic:
        description: "Enable Tier 1.75 semantic layer (slow — see Section 4.9.2)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: repoguard-pip-${{ runner.os }}-py313

      - name: Install RepoGuard and CloneGuard
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cloneguard[mini]"
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi

      - name: Determine changed files (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" || true
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > changed.txt
          echo "Changed files:"
          cat changed.txt
          test -s changed.txt || echo "(no files changed)"

      - name: Scan changed files
        if: github.event_name == 'pull_request'
        run: |
          python scripts/ci_scan.py \
            --files-from changed.txt \
            --exclude 'scripts/*' \
            --report repoguard-report.json

      - name: Full repository scan
        if: github.event_name != 'pull_request'
        run: |
          python scripts/ci_scan.py \
            --all \
            --exclude 'scripts/*' \
            ${{ (github.event.inputs.semantic == 'true') && '--semantic' || '' }} \
            --report repoguard-report.json

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoguard-report
          path: repoguard-report.json
          retention-days: 30
          if-no-files-found: warn
